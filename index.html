<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 日报</title>
<meta name="description" content="每天自动汇总多个 AI 信息源的日报，保留原文配图与出处。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161a1c'/%3E%3Crect x='6' y='8' width='20' height='2.5' fill='%23e8eae4'/%3E%3Crect x='6' y='14' width='20' height='2.5' fill='%23e8eae4'/%3E%3Crect x='6' y='20' width='12' height='2.5' fill='%23b8341f'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#e8eae4;
  --card:#f5f6f2;
  --ink:#161a1c;
  --ink-soft:#4a5257;
  --ink-faint:#7b8489;
  --blue:#1f4fa3;
  --seal:#b8341f;
  --rule:#c6c9c0;
  --rule-strong:#161a1c;
  --font-display:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","Source Han Serif CN",SimSun,serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --gutter:clamp(20px,5vw,64px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(31,79,163,.28)}
a:hover{border-bottom-color:var(--blue)}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gutter)}

/* ---------- masthead ---------- */
.masthead{padding:clamp(34px,7vw,76px) 0 0}
.masthead-top{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:clamp(18px,4vw,44px);
  padding-bottom:26px;
}
.dateline{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.date{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(46px,10vw,104px);line-height:.86;letter-spacing:-.02em;
  margin:0;font-variant-numeric:tabular-nums;
}
.date .yr{font-size:.34em;letter-spacing:.06em;vertical-align:.62em;color:var(--ink-soft);margin-right:.18em}
.seal{
  font-family:var(--font-display);font-weight:700;color:var(--seal);
  border:2.5px solid var(--seal);padding:5px 11px 6px;line-height:1;
  font-size:clamp(15px,2.4vw,21px);letter-spacing:.22em;text-indent:.22em;
  transform:rotate(-3.2deg);align-self:flex-start;margin-top:6px;
  flex:none;
}
.weekday{
  font-family:var(--font-display);font-size:clamp(17px,2.6vw,24px);
  color:var(--ink-soft);align-self:flex-end;padding-bottom:.35em;
}
.vitals{
  margin:0 0 0 auto;display:flex;gap:clamp(16px,3vw,34px);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.5;
  color:var(--ink-faint);letter-spacing:.02em;text-align:right;
}
.vitals b{display:block;color:var(--ink);font-weight:600;font-size:15px;letter-spacing:0}
.vitals span{white-space:nowrap}
.rule-thick{border:0;border-top:3px solid var(--rule-strong);margin:0}
.rule-thin{border:0;border-top:1px solid var(--rule);margin:0}

/* ---------- status strip ---------- */
.strip{
  display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;
  padding:11px 0;font-family:var(--font-mono);font-size:11.5px;
  color:var(--ink-faint);letter-spacing:.02em;
}
.strip .src{display:flex;gap:7px;align-items:baseline}
.strip .src i{font-style:normal;color:var(--ink);font-weight:600}
.dot{width:5px;height:5px;background:var(--rule-strong);flex:none;transform:translateY(-1px)}
.dot.warn{background:var(--seal)}

/* ---------- digest ---------- */
.digest{
  background:var(--card);border-left:3px solid var(--rule-strong);
  padding:clamp(20px,4vw,34px) clamp(20px,4vw,40px);
  margin:clamp(26px,5vw,44px) 0 clamp(30px,6vw,52px);
}
.digest h2{
  font-family:var(--font-display);font-size:clamp(19px,2.6vw,23px);
  margin:0 0 18px;letter-spacing:.04em;font-weight:700;
}
.digest ol{list-style:none;margin:0;padding:0;counter-reset:p}
.digest li{
  counter-increment:p;display:grid;
  grid-template-columns:2.1em 1fr;gap:0 12px;
  padding:11px 0;border-top:1px solid var(--rule);
  font-size:15.5px;line-height:1.72;
}
.digest li:first-child{border-top:0}
.digest li::before{
  content:counter(p,decimal-leading-zero);
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  padding-top:.42em;letter-spacing:.04em;
}
.digest .from{color:var(--ink-faint);font-size:13.5px;white-space:nowrap}
.trend{
  margin:22px 0 0;padding-top:18px;border-top:1px solid var(--rule);
  font-family:var(--font-display);font-size:16.5px;line-height:1.95;color:var(--ink);
}
.trend b{color:var(--seal);font-weight:700;letter-spacing:.03em}

/* ---------- sections ---------- */
.sec-head{
  display:flex;align-items:baseline;gap:14px;
  margin:clamp(34px,6vw,54px) 0 20px;
}
.sec-head h2{
  font-family:var(--font-display);font-size:clamp(21px,3.2vw,28px);
  margin:0;letter-spacing:.03em;font-weight:700;white-space:nowrap;
}
.sec-head .count{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint)}
.sec-head .fill{flex:1;border-top:1px solid var(--rule-strong);min-width:20px}

.entry{
  display:grid;grid-template-columns:132px 1fr;gap:0 clamp(18px,3.5vw,34px);
  padding:clamp(22px,4vw,32px) 0;border-top:1px solid var(--rule);
}
.entry:first-of-type{border-top:0}
aside{font-family:var(--font-mono);font-size:11.5px;line-height:1.6;color:var(--ink-faint)}
aside .label{
  display:block;font-family:var(--font-body);font-size:13px;font-weight:600;
  color:var(--ink);letter-spacing:.02em;margin-bottom:9px;line-height:1.5;
}
aside time{display:block;margin-bottom:5px}
aside a{display:inline-block;margin-top:9px;font-size:11px}
.body h3{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(19px,2.8vw,25px);line-height:1.45;margin:0 0 14px;
  letter-spacing:.01em;max-width:62ch;
}
.body h3 a{color:var(--ink);border-bottom-color:transparent}
.body h3 a:hover{color:var(--blue);border-bottom-color:var(--blue)}
.body p{margin:0 0 14px;max-width:68ch;color:var(--ink-soft);font-size:15.5px}
.shots{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0 4px}
.shots figure{margin:0;flex:1 1 240px;min-width:0}
.shots img{
  display:block;width:100%;height:auto;background:#fff;
  border:1px solid var(--rule);aspect-ratio:16/9;object-fit:cover;
}
.shots figcaption{
  font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);
  margin-top:6px;letter-spacing:.02em;
}
.more{
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);
  margin-top:16px;padding-top:12px;border-top:1px dotted var(--rule);
}

/* ---------- archive ---------- */
.nav{
  display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;
  margin:0 0 clamp(20px,4vw,32px);
}
.nav .cap{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  letter-spacing:.02em;margin-right:6px;
}
.nav button{
  font:inherit;font-family:var(--font-mono);font-size:11.5px;
  background:transparent;color:var(--ink-soft);
  border:1px solid var(--rule);padding:5px 11px;cursor:pointer;
  letter-spacing:.02em;border-radius:0;
}
.nav button:hover{border-color:var(--rule-strong);color:var(--ink)}
.nav button[aria-current="date"]{
  background:var(--rule-strong);color:var(--paper);border-color:var(--rule-strong);
}
details.past{margin-top:8px;border-top:1px solid var(--rule);padding-top:8px}
details.past>summary{
  cursor:pointer;list-style:none;padding:12px 0;
  font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);
  letter-spacing:.02em;display:flex;align-items:center;gap:10px;
}
details.past>summary::-webkit-list-item-marker{display:none}
details.past>summary::before{content:"+";font-size:15px;color:var(--ink-faint)}
details.past[open]>summary::before{content:"−"}
details.past>summary:hover{color:var(--ink)}

/* ---------- footer ---------- */
footer{
  margin-top:clamp(40px,8vw,72px);padding:24px 0 46px;
  border-top:3px solid var(--rule-strong);
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);
  display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:space-between;
}
footer a{color:var(--ink-soft);border-bottom-color:transparent}
footer a:hover{border-bottom-color:var(--ink-soft)}

/* ---------- states ---------- */
.notice{
  padding:14px 0;font-family:var(--font-mono);font-size:12.5px;
  color:var(--seal);letter-spacing:.02em;
}
.skeleton{padding:60px 0;color:var(--ink-faint);font-family:var(--font-mono);font-size:12px}
[hidden]{display:none!important}

@media (prefers-reduced-motion:no-preference){
  .masthead-top,.digest{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .digest{animation-delay:.08s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
@media (max-width:720px){
  .entry{grid-template-columns:1fr;gap:14px}
  aside{display:flex;flex-wrap:wrap;gap:0 16px;align-items:baseline}
  aside .label{margin-bottom:2px}
  aside time{margin:0}
  aside a{margin:0}
  .vitals{margin-left:0;text-align:left;width:100%}
  .digest li{grid-template-columns:1fr}
  .digest li::before{padding-top:0;margin-bottom:2px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-top">
      <div class="dateline">
        <h1 class="date" id="date"><span class="yr"></span>—‑—</h1>
        <div class="seal">已核校</div>
        <div class="weekday" id="weekday"></div>
      </div>
      <div class="vitals" id="vitals" hidden>
        <span><b id="v-src">—</b>信息源</span>
        <span><b id="v-art">—</b>收录条目</span>
        <span><b id="v-img">—</b>已存配图</span>
      </div>
    </div>
    <hr class="rule-thick">
    <div class="strip" id="strip"></div>
    <nav class="nav" id="days" hidden aria-label="按日期查看"></nav>
  </header>

  <main>
    <div id="status" class="skeleton">正在读取今日数据…</div>

    <section class="digest" id="digest" hidden>
      <h2>今日要点</h2>
      <ol id="points"></ol>
      <p class="trend" id="trend" hidden></p>
    </section>

    <div id="feed"></div>
  </main>

  <footer>
    <span>本页由 GitHub Actions 每日自动生成，配图已镜像至本仓库</span>
    <span><a href="https://github.com/siweimidu/ai-daily-sources">数据来源与脚本</a></span>
  </footer>

</div>

<script>
(function () {
  "use strict";

  var SOURCES_URL = "./sources.json";
  var BRIEFING_URL = "https://raw.githubusercontent.com/siweimidu/daily-briefing/main/data/briefing.json";
  var OK_IMG = /\.(png|jpe?g|gif|webp|avif)(\?|#|$)/i;
  var WEEKDAYS = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function safeUrl(u) {
    u = String(u || "").trim();
    return /^https?:\/\/.+/i.test(u) ? u : "";
  }
  function get(url, timeout) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, timeout || 12000);
    return fetch(url, { signal: ctrl.signal, cache: "no-store" })
      .then(function (r) { clearTimeout(t); if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (txt) { return JSON.parse(txt); });
  }
  function dayLabel(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    if (!m) return "";
    return m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日";
  }
  function weekdayOf(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    if (!m) return "";
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d) ? "" : WEEKDAYS[d.getDay()];
  }
  function hhmm(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
      " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function clip(text, n) {
    text = String(text || "").replace(/\s+/g, " ").trim();
    if (text.length <= n) return text;
    var cut = text.slice(0, n);
    var last = Math.max(cut.lastIndexOf("。"), cut.lastIndexOf("！"), cut.lastIndexOf("？"), cut.lastIndexOf("."));
    return (last > n * 0.45 ? cut.slice(0, last + 1) : cut.replace(/[\s,;:]+$/, "") + "…");
  }

  function imagesOf(a) {
    var list = (a.images || []).filter(function (u) { return safeUrl(u) && OK_IMG.test(safeUrl(u)); });
    return list.slice(0, 4);
  }

  function renderEntry(a, today) {
    var imgs = imagesOf(a);
    var isToday = (a.published_at || "").slice(0, 10) === today;
    var body = a.plain_text || a.summary || "";
    var html = '<article class="entry">' +
      '<aside>' +
        '<span class="label">' + esc(a.source_label || a.source || "未知来源") + '</span>' +
        '<time>' + esc((a.published_at || "").slice(0, 10) || "日期未知") + '</time>' +
        (safeUrl(a.link) ? '<a href="' + esc(safeUrl(a.link)) + '" target="_blank" rel="noopener">原文 ↗</a>' : '') +
      '</aside>' +
      '<div class="body">' +
        '<h3>' + (safeUrl(a.link)
          ? '<a href="' + esc(safeUrl(a.link)) + '" target="_blank" rel="noopener">' + esc(a.title || "（无标题）") + '</a>'
          : esc(a.title || "（无标题）")) + '</h3>' +
        (imgs.length ? '<div class="shots">' + imgs.map(function (u, i) {
          return '<figure><img src="' + esc(u) + '" alt="' + esc((a.title || "") + ' 配图 ' + (i + 1)) +
            '" loading="lazy" onerror="this.closest(\'figure\').remove()"><figcaption>图 ' + (i + 1) +
            ' · 来自 ' + esc(a.source_label || a.source || "原站") + '</figcaption></figure>';
        }).join("") + '</div>' : '') +
        '<p>' + esc(clip(body, isToday ? 900 : 260)) + '</p>' +
        (body.length > 900 ? '<div class="more">以上为节选，完整内容请读原文</div>' : '') +
      '</div></article>';
    return html;
  }

  function groupBySource(articles, today) {
    var order = [], map = {};
    articles.forEach(function (a) {
      var k = a.source || "other";
      if (!map[k]) { map[k] = { label: a.source_label || k, fresh: [], past: [] }; order.push(k); }
      (a.published_at && a.published_at.slice(0, 10) !== today ? map[k].past : map[k].fresh).push(a);
    });
    return order.map(function (k) { return map[k]; });
  }

  function renderFeed(doc) {
    var today = doc.date || "";
    var groups = groupBySource(doc.articles || [], today);
    var html = '<div class="sec-head"><h2>各源原文</h2><span class="count">' +
      (doc.articles || []).length + ' 条 · 保留原站配图</span><span class="fill"></span></div>';

    groups.forEach(function (g) {
      html += '<section>' + g.fresh.map(function (a) { return renderEntry(a, today); }).join("");
      if (g.past.length) {
        html += '<details class="past"><summary>更早的 ' + g.past.length + ' 条（' + esc(g.label) + '）</summary>' +
          g.past.map(function (a) { return renderEntry(a, today); }).join("") + '</details>';
      }
      html += '</section>';
    });
    document.getElementById("feed").innerHTML = html;
  }

  function renderDigest(briefing) {
    if (!briefing || !Array.isArray(briefing.articles) || !briefing.articles.length) return;
    var pts = document.getElementById("points");
    pts.innerHTML = briefing.articles.map(function (a) {
      return '<li><span>' + esc(a.title || "") +
        (a.summary ? '<br>' + esc(clip(a.summary, 150)) : '') +
        '<br><span class="from">AI 检索精选 · ' + esc((briefing.date || "").slice(0, 10)) + '</span></span></li>';
    }).join("");
    document.getElementById("digest").hidden = false;
  }

  function renderHead(doc) {
    var d = doc.date || new Date().toISOString().slice(0, 10);
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d) || [];
    document.getElementById("date").innerHTML =
      (m[1] ? '<span class="yr">' + esc(m[1]) + '</span>' : '') + esc(m[2] || "") + "·" + esc(m[3] || "");
    document.getElementById("weekday").textContent = weekdayOf(d);
    document.title = "AI 日报 · " + dayLabel(d);

    var v = document.getElementById("vitals");
    v.hidden = false;
    document.getElementById("v-src").textContent = (doc.sources || []).length;
    document.getElementById("v-art").textContent = doc.count != null ? doc.count : (doc.articles || []).length;
    document.getElementById("v-img").textContent = doc.images_mirrored || 0;

    var fresh = (doc.articles || []).filter(function (a) { return (a.published_at || "").slice(0, 10) === d; }).length;
    var strip = '<span class="src"><span class="dot"></span>生成于 ' + esc(hhmm(doc.generated_at) || "—") + '</span>' +
      '<span class="src"><span class="dot"></span>本期新收 <i>' + fresh + '</i> 条</span>';
    (doc.sources || []).forEach(function (s) {
      strip += '<span class="src"><span class="dot"></span>' + esc(s.label) + ' <i>' + s.articles + '</i></span>';
    });
    if ((doc.failures || []).length) {
      doc.failures.forEach(function (f) {
        strip += '<span class="src"><span class="dot warn"></span>抓取失败 ' + esc(String(f).slice(0, 40)) + '</span>';
      });
    }
    document.getElementById("strip").innerHTML = strip;
  }

  function renderAll(doc) {
    document.getElementById("feed").innerHTML = "";
    document.getElementById("digest").hidden = true;
    document.getElementById("points").innerHTML = "";
    renderHead(doc);
    renderFeed(doc);
  }

  function renderNav(days, activeDate) {
    var el = document.getElementById("days");
    if (!days || days.length < 2) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = '<span class="cap">按日期查看</span>' + days.map(function (d) {
      var on = d.date === activeDate;
      return '<button type="button" data-date="' + esc(d.date) + '"' +
        (on ? ' aria-current="date"' : '') + '>' +
        esc((d.date || "").slice(5).replace("-", "/")) +
        '<span style="opacity:.6"> · ' + (d.count || 0) + '条</span></button>';
    }).join("");
  }

  var ALL_DAYS = [];

  function loadDay(date, push) {
    var url = date === LATEST_DATE ? SOURCES_URL : "./archive/" + encodeURIComponent(date) + ".json";
    get(url, 15000)
      .then(function (doc) {
        document.getElementById("status").hidden = true;
        renderAll(doc);
        renderNav(ALL_DAYS, date);
        if (push) history.replaceState(null, "", date === LATEST_DATE ? "./" : "#" + date);
        window.scrollTo({ top: 0, behavior: "smooth" });
      })
      .catch(function () {
        var el = document.getElementById("status");
        el.hidden = false;
        el.className = "notice";
        el.textContent = "那天的数据读不出来（可能已超出 30 天保留期）。";
      });
  }

  document.getElementById("days").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-date]");
    if (btn) loadDay(btn.getAttribute("data-date"), true);
  });

  var LATEST_DATE = "";

  get(SOURCES_URL, 15000)
    .then(function (doc) {
      document.getElementById("status").hidden = true;
      if (!doc.articles || !doc.articles.length) {
        var el = document.getElementById("status");
        el.hidden = false;
        el.className = "notice";
        el.textContent = "今日还没有收录到任何条目，可能是源站当天未更新。";
      }
      LATEST_DATE = doc.date || "";
      renderAll(doc);

      // Date list, then wire up switching.
      get("./archive/index.json", 8000)
        .then(function (days) {
          ALL_DAYS = Array.isArray(days) ? days : [];
          renderNav(ALL_DAYS, LATEST_DATE);
          var want = (location.hash || "").replace("#", "");
          if (want && want !== LATEST_DATE && ALL_DAYS.some(function (d) { return d.date === want; })) {
            loadDay(want, false);
          }
        })
        .catch(function () { ALL_DAYS = []; });

      get(BRIEFING_URL, 8000).then(renderDigest).catch(function () {});
    })
    .catch(function (err) {
      var el = document.getElementById("status");
      el.className = "notice";
      el.textContent = "读取数据失败（" + (err && err.message ? err.message : "网络错误") +
        "）。今天 08:02 之后 Actions 应已生成 sources.json，若刚过 8 点请稍后刷新。";
    });
})();
</script>
</body>
